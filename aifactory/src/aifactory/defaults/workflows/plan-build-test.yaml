# YAML form of adw_plan_build_test.py.
# Phases: engineer(request) -> planner -> builder -> code(test)
#         [-> builder(fix) -> code(test) ... bounded] -> git(commit)
# Loop (2.7): the last round ends at the test step, so a last red suite is not followed by fix_3.
name: plan-build-test
description: Plan and build, repair until the suite is green, and commit only green code
steps:
  - plan
  - build
  - repeat: {max: 3, until: test.passed}
    steps:
      - test
      - fix
  - commit:
      when: test.passed
      description: Land the code once the suite has come back green
accept: test.passed
