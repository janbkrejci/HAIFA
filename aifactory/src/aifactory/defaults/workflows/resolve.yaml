# A pull request that conflicts with base (step 6 of "Běh úkolu"): factory task resolve <task-id>.
# Phases: engineer(request) -> git(rebase) [-> builder(resolve), only on a conflict]
#         -> tester(test_plan) -> [code(rebuild)] -> code(test) [-> builder(fix) -> ... bounded]
# Code commits and pushes after the workflow: only without conflict markers and with a green suite.
# Repairs may change the task writes even when those files had no conflict.
# `rebuild` rebuilds the generated outputs (`generated:` in .factory/config.yaml)
# that have a conflicted file; the agents may not touch them. It runs before
# every test, so a fix of the sources is built too; without such a conflict it
# does nothing.
name: resolve
description: Bring a conflicting pull request up to date with base and prove the suite is still green
steps:
  - rebase
  - resolve:
      when: rebase.conflict
      description: Settle every conflict in the files the rebase reported, keeping both sides' intent
  - test_plan:
      description: Choose the checks for the rebased branch — a rebase mixes two lines of work, so cover both
  - repeat: {max: 3, until: test.passed}
    steps:
      - rebuild:
          when: rebase.conflict
          description: Rebuild the generated outputs in conflict from the resolved sources
      - test:
          description: Run the checks on the rebased branch before it is pushed
      - fix:
          description: Repair what the suite reported, from its verbatim output, within the task writes, including files without conflicts
      - test_plan:
          description: Plan the checks again — the fix changed code, keep every earlier check
accept: test.passed
