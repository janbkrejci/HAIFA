name: resolve-reviewed
description: Resolve like `resolve`, then review a resolution the agent wrote; auto-merge resolves a conflicting PR with it
steps:
  - rebase
  - resolve:
      when: rebase.conflict
      description: Settle every conflict in the files the rebase reported, keeping both sides' intent
  - test_plan:
      description: Diff against the PR head before rebase, including automatic merges; documentation needs reader checks only, code needs affected projects and callers
  - repeat: {max: 3, until: test.passed}
    steps:
      - rebuild:
          when: rebase.conflict
          description: Rebuild the generated outputs in conflict from the resolved sources
      - test:
          description: Run the checks on the rebased branch before it is pushed
      - fix:
          description: Repair what the suite reported, from its verbatim output, within the task writes, including files without conflicts
      - test_plan:
          description: Plan the checks again — the fix changed code, retain failures and check the latest edits and direct callers; the whole suite confirms later
  - review:
      when: (resolve.ran or fix.ran) and test.passed
      input: [resolve, fix]
      description: Confirm the resolved branch still does what the task asked and keeps what base now holds
accept: test.passed and (not (resolve.ran or fix.ran) or review.approved)
