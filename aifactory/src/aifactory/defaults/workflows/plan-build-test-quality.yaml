# YAML form of adw_plan_build_test_quality.py.
# Select quality checks from the diff; repair rounds are scoped.
# A requested whole suite confirms once before commit, after repairs.
name: plan-build-test-quality
description: Plan and build, then lint, typecheck, build and test the whole repo with repairs, and commit only verified code
steps:
  - plan
  - build:
      description: Implement the plan exactly
  - test_plan:
      description: Select static checks, builds and tests for the diff and direct callers
  - repeat: {max: 3, until: test.passed}
    steps:
      - test:
          description: Run the quality checks and the tests
      - fix:
          description: Repair what the checks reported, from their verbatim output
      - test_plan:
          coverage: scoped
          description: Retain failures and check the repair and direct callers
  - commit:
      when: test.passed
      description: Land the code once every check has come back green
accept: test.passed
