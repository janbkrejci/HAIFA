# Request a whole-suite confirmation; repair rounds run only scoped checks.
name: heal
description: Repair the repo with scoped checks and confirm the whole suite once before commit
steps:
  - test_plan:
      id: full_plan
      coverage: full
      description: Request every check the repo has for final confirmation
  - repeat: {max: 6, until: test.passed}
    steps:
      - test
      - fix:
          description: Repair every failure from its verbatim output
      - test_plan:
          id: repair_plan
          coverage: scoped
          description: Check failed and affected behavior and direct callers
  - commit:
      when: test.passed
      description: Commit after scoped repairs and the single final confirmation
accept: test.passed
