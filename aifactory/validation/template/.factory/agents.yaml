# Agent roster of the validation sandbox (aifactory .factory/agents.yaml).
#
# Cheap defaults, one harness per agent. To try other models, change `model:`
# here in the sandbox template (aifactory/validation/template/.factory/) before
# `just validate --remote github`, or pass `--roster DIR`. The workflow
# .factory/workflows/simple-sdlc.yaml names the harness of every step.
# Prompts are .factory/prompts/<agent>/{system,user}.md.
defaults:
  thinking: low

agents:
  - name: planner
    harness: claude
    model: sonnet
    purpose: Turn the task into a short plan the builder can follow.
    writes:
      - specs/

  - name: builder
    harness: codex
    model: gpt-5.5
    purpose: Implement the plan exactly; report every changed file.

  - name: tester
    harness: claude
    model: sonnet
    purpose: Choose the checks that verify the change; change nothing.
    writes: []

  - name: test-reviewer
    harness: claude
    model: sonnet
    purpose: Judge each test plan before it runs; change nothing.
    writes: []

  - name: reviewer
    harness: pi
    model: nous-portal/stealth/space-bunny-alpha
    purpose: Confirm that what was built is what was asked for; change nothing.
    writes: []

  - name: documenter
    harness: claude
    model: haiku
    purpose: Write up the change from the diff; document only.
    writes:
      - app_docs/
