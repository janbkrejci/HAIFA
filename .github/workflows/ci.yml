name: Release

on:
  push:
    branches: [main]
    # backlog, task specs and docs, decisions and the operator's .factory/ change no
    # product code: no new release
    paths-ignore: ['factory/**', 'docs/**', '.factory/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
      - name: Build frontend
        working-directory: aifactory/web
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Build uniquely versioned release bundle
        id: bundle
        working-directory: aifactory
        run: |
          uv sync --locked
          version="$(.venv/bin/python -m bundle.release)"
          .venv/bin/python -m bundle.build
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify fresh tool installation
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/haifa-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/haifa-bin
          EXPECTED_VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          unzip "aifactory/dist/haifa-$EXPECTED_VERSION.zip" -d "$RUNNER_TEMP/haifa-install"
          bash "$RUNNER_TEMP/haifa-install/haifa-$EXPECTED_VERSION/install.sh"
          "$UV_TOOL_BIN_DIR/factory" --version | grep -Fx "factory $EXPECTED_VERSION"
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          git fetch --no-tags origin main
          current="$(git rev-parse FETCH_HEAD)"
          # Match paths-ignore above: a backlog-only push does not start a replacement build.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$current"; then
            echo "The build is no longer on main; skip publishing."
            exit 0
          fi
          if ! git diff --quiet "$GITHUB_SHA" "$current" -- . \
            ':(top,exclude)factory/**' ':(top,exclude)docs/**' ':(top,exclude).factory/**'; then
            echo "Newer product changes are on main; skip publishing this older build."
            exit 0
          fi
          tag="v$VERSION"
          if gh release view "$tag" --json isDraft --jq .isDraft > "$RUNNER_TEMP/haifa-draft" 2>/dev/null; then
            if [ "$(cat "$RUNNER_TEMP/haifa-draft")" = false ]; then
              echo "This build is already published."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "HAIFA $VERSION" --notes "Automatically built release bundle. Source commit: $GITHUB_SHA."
          fi
          gh release upload "$tag" "aifactory/dist/haifa-$VERSION.zip" --clobber
          gh release edit "$tag" --draft=false --latest
