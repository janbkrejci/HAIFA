name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-haifa-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'janbkrejci/HAIFA' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/tags/haifa-transition-acl-source' &&
      github.sha == vars.HAIFA_TRANSITION_HOTFIX_SHA &&
      vars.HAIFA_TRANSITION_HOTFIX_PUBLISHED == 'false' &&
      vars.HAIFA_TRANSITION_PUBLISHED == 'true' &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      HAIFA_TRANSITION_HOTFIX_SHA: ${{ vars.HAIFA_TRANSITION_HOTFIX_SHA }}
      HAIFA_TRANSITION_HOTFIX_PUBLISHED: ${{ vars.HAIFA_TRANSITION_HOTFIX_PUBLISHED }}
      HAIFA_TRANSITION_SHA: ${{ vars.HAIFA_TRANSITION_SHA }}
      HAIFA_TRANSITION_PUBLISHED: ${{ vars.HAIFA_TRANSITION_PUBLISHED }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ vars.HAIFA_TRANSITION_HOTFIX_SHA }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
      - name: Verify final HAIFA publication gate
        working-directory: aifactory
        run: uv run python -m bundle.release --check-transition
      - name: Build frontend
        working-directory: aifactory/web
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Build uniquely versioned release bundle
        id: bundle
        working-directory: aifactory
        run: |
          uv sync --locked
          version="$(.venv/bin/python -m bundle.release)"
          .venv/bin/python -m bundle.build
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify fresh tool installation
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/haifa-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/haifa-bin
          HAIFA_HOME: ${{ runner.temp }}/haifa-home
          EXPECTED_VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          unzip "aifactory/dist/haifa-$EXPECTED_VERSION.zip" -d "$RUNNER_TEMP/haifa-install"
          bash "$RUNNER_TEMP/haifa-install/haifa-$EXPECTED_VERSION/install.sh"
          "$UV_TOOL_BIN_DIR/factory" --version | grep -Fx "factory $EXPECTED_VERSION"
      - name: Publish completed release
        env:
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          cd aifactory
          .venv/bin/python -m bundle.release --check-transition
          # Claim this one ACL hotfix. Keep the original publication marker intact.
          git tag haifa-transition-acl-published "$GITHUB_SHA"
          git push origin refs/tags/haifa-transition-acl-published
          tag="v$VERSION"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "HAIFA $VERSION" --notes "Windows GIRO migration hotfix: preserve and verify backup access rules without requiring audit privileges. Update HAIFA first, then retry the GIRO transition. Source commit: $GITHUB_SHA."
          gh release upload "$tag" "dist/haifa-$VERSION.zip"
          gh release edit "$tag" --draft=false --latest
