# Lean workflow for tasks with a precise ask (Where, Done means): no separate plan,
# no write-up. Big or vague tasks keep simple-sdlc (planner and documenter).
name: build-test-review
description: Build straight from the task, test with repairs, review with revision — no separate plan or write-up
steps:
  - build:
      description: Implement the task exactly
  - test_plan
  - repeat: {max: 3, until: test.passed}
    steps:
      - test
      - fix:
          description: Repair what the checks reported, from their verbatim output
      - test_plan:
          description: Plan the checks again — the fix changed code, keep every earlier check
  - repeat: {max: 2, until: review.approved}
    steps:
      - review:
          input: [build, fix, revise]
          description: Confirm the build matches the task and the checks fit the change
      - revise
      - test_plan:
          id: replan
          input: [review]
          description: Plan the checks again from the review and the revised code
      - test:
          id: retest
          description: Run the new checks on the revised code before the next review
  - commit:
      id: commit_build
      when: test.passed and review.approved
      description: "Land the code only now: green suite, approved review"
accept: test.passed and review.approved
