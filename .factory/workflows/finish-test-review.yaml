name: finish-test-review
description: Finish an existing implementation with full checks, browser tests, review and documentation
steps:
  - build:
      description: Reuse the existing implementation and report its diff; do not reimplement or rerun planning
  - repeat: {max: 3, until: full_check.passed}
    steps:
      - command:
          id: full_check
          argv: [just, check, e2e]
          timeout: 5400
          description: Run all frontend and backend tests, types, lint and serial browser acceptance
      - fix:
          when: not full_check.passed
          input: [build, full_check]
          description: Repair only failures reported by the checks
  - repeat: {max: 2, until: review.approved}
    steps:
      - review:
          input: [build, full_check, fix, revise]
      - revise
  - command:
      id: retest
      when: revise.ran and review.approved
      argv: [just, check, e2e]
      timeout: 5400
      description: Recheck the final code after a review revision
  - document:
      when: full_check.passed and review.approved and (not revise.ran or retest.passed)
      description: Update existing task documentation with the final validation results
  - commit:
      when: full_check.passed and review.approved and (not revise.ran or retest.passed)
accept: full_check.passed and review.approved and (not revise.ran or retest.passed)
